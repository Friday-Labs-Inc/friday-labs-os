# slam_toolbox (online async) — Phase 2 "I can build my world".
# Consumes /scan (Phase 0 lidar) + odom->base_link (Phase 1 EKF); owns the
# map->odom TF (REP-105 completes: map -> odom -> base_link -> sensors).
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    resolution: 0.05
    max_laser_range: 12.0
    minimum_travel_distance: 0.15
    minimum_travel_heading: 0.15
    map_update_interval: 1.5
    transform_publish_period: 0.05
