# Mark 1 Stage 1 — wheel control. Skid/differential steer: the 3 left wheels share
# one speed, the 3 right wheels another. Takes a Twist on cmd_vel, publishes odom.
controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names:  [wheel_left_front_joint,  wheel_left_mid_joint,  wheel_left_rear_joint]
    right_wheel_names: [wheel_right_front_joint, wheel_right_mid_joint, wheel_right_rear_joint]

    wheel_separation: 0.582      # corner-wheel track (m)
    wheel_radius: 0.070

    base_frame_id: base_link
    odom_frame_id: odom
    publish_rate: 50.0
    enable_odom_tf: true
    open_loop: false
    use_stamped_vel: false       # accept plain geometry_msgs/Twist on cmd_vel

    # gentle limits for first-light stability
    linear.x.max_velocity: 0.6
    linear.x.min_velocity: -0.6
    angular.z.max_velocity: 1.2
    angular.z.min_velocity: -1.2
    cmd_vel_timeout: 0.5
