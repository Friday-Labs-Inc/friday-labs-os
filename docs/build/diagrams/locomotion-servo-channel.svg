<svg width="100%" viewBox="0 0 680 250" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Locomotion servo channel pin-level schematic</title>
<desc>One steering-servo channel: ESP32-S3 GPIO12 (LEDC PWM) crosses the galvanic barrier through an ISO7741 channel (servo-side reference +5V_SRV / GND_SRV) to the servo signal pin; servo powered by the 6 V UBEC rail. Open-loop, no feedback. Repeats for all four corner servos.</desc>
<defs>
<marker id="ds" viewBox="0 0 8 8" markerWidth="5" markerHeight="5" refX="6.5" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.lab,.nl{font-size:14px;font-weight:500;fill:#1f2328}
.sub{font-size:12px;font-weight:400;fill:#656d76}
.bg{fill:#ffffff}
@media (prefers-color-scheme:dark){.lab,.nl{fill:#e6edf3}.sub{fill:#9aa0a8}.bg{fill:#0d1117}}
</style>
</defs>
<rect class="bg" x="0" y="0" width="680" height="250"/>
<text class="sub" x="44" y="30">servo channel 1 of 4 — open-loop, no feedback line</text>
<rect x="40" y="62" width="124" height="128" rx="6" fill="rgba(46,160,99,0.1)" stroke="rgba(46,160,99,0.5)"/>
<rect x="418" y="78" width="222" height="116" rx="6" fill="rgba(196,138,30,0.12)" stroke="rgba(196,138,30,0.55)"/>
<line x1="298" y1="66" x2="298" y2="200" stroke="#9aa0a8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="sub" x="298" y="216" text-anchor="middle">galvanic isolation</text>
<rect x="44" y="74" width="112" height="104" rx="4" fill="rgba(46,160,99,0.16)" stroke="#2e9d63"/>
<text class="lab" x="100" y="122" text-anchor="middle">ESP32-S3</text>
<text class="sub" x="100" y="138" text-anchor="middle">clean domain</text>
<text class="sub" x="150" y="116" text-anchor="end">GPIO12</text>
<rect x="250" y="86" width="96" height="100" rx="4" fill="rgba(120,125,135,0.22)" stroke="#6b7280"/>
<text class="lab" x="298" y="128" text-anchor="middle">ISO7741 #4</text>
<text class="sub" x="298" y="144" text-anchor="middle">servo channel</text>
<text class="sub" x="256" y="116" text-anchor="start">IN</text>
<text class="sub" x="340" y="116" text-anchor="end">OUT</text>
<text class="sub" x="270" y="80" text-anchor="middle">+3V3</text>
<text class="sub" x="330" y="80" text-anchor="middle">+5V_SRV</text>
<text class="sub" x="298" y="202" text-anchor="middle">GND_CLEAN · GND_SRV</text>
<rect x="430" y="90" width="140" height="100" rx="4" fill="rgba(196,138,30,0.2)" stroke="#b9831e"/>
<text class="lab" x="500" y="132" text-anchor="middle">steer servo 1</text>
<text class="sub" x="500" y="148" text-anchor="middle">DS3218 · open-loop</text>
<text class="sub" x="436" y="116" text-anchor="start">SIG</text>
<text class="sub" x="500" y="84" text-anchor="middle">+6V_SRV</text>
<text class="sub" x="500" y="204" text-anchor="middle">GND_SRV</text>
<path d="M156,110 L250,110" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ds)"/>
<text class="nl" x="200" y="104" text-anchor="middle">SRV_PWM1</text>
<path d="M346,110 L430,110" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ds)"/>
<text class="sub" x="388" y="104" text-anchor="middle">servo pulse</text>
</svg>
