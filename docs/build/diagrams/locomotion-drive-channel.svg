<path d="M346,113 L430,113" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#d)"/>
<path d="M346,138 L430,138" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#d)"/>
<path d="M388,113 L388,236" fill="none" stroke="#6b7280" stroke-width="1.4"/>
<rect x="381" y="236" width="14" height="26" rx="2" fill="none" stroke="#6b7280" stroke-width="1.4"/>
<path d="M388,262 L388,276" fill="none" stroke="#6b7280" stroke-width="1.4"/>
<text class="pn" x="400" y="252" text-anchor="start">10k</text>
<text class="sub" x="388" y="290" text-anchor="middle">GND_MOTOR</text>
<text class="sub" x="360" y="316" text-anchor="middle">PWM low on signal loss → motors off</text>
<path d="M548,115 L600,124" fill="none" stroke="#6b7280" stroke-width="1.4"/>
<path d="M548,140 L600,134" fill="none" stroke="#6b7280" stroke-width="1.4"/>
<line x1="576" y1="119" x2="576" y2="129" stroke="#6b7280" stroke-width="1.6"/>
<line x1="582" y1="119" x2="582" y2="129" stroke="#6b7280" stroke-width="1.6"/>
<text class="pn" x="579" y="112" text-anchor="middle">100nF</text>
<text class="sub" x="489" y="200" text-anchor="middle">+ 1000µF bulk (B+/B-)</text>
<path d="M150,318 L150,300 L150,236" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#d)"/>
<text class="sub" x="158" y="280" text-anchor="start">SDA0/SCL0 via TCA9548A ch1</text>
<text class="sub" x="180" y="416" text-anchor="middle">+3V3_CLEAN · GND_CLEAN · magnet on shaft</text>
</svg>
