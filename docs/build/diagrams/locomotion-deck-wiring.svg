<rect x="44" y="530" width="596" height="32" rx="4" fill="rgba(120,125,135,0.16)" stroke="#7a7f88"/>
<text class="lab" x="342" y="546" text-anchor="middle">star ground</text>
<text class="sub" x="342" y="558" text-anchor="middle">clean · motor · servo grounds join only at battery negative</text>
