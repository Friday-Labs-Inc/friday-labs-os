<svg width="100%" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Locomotion deck wiring diagram</title>
<desc>Block wiring diagram of the Mark 1 Locomotion Control Unit: an ESP32-S3 in a clean logic domain controls six drive motors and four steering servos across a galvanic isolation barrier, with separate motor and servo power domains, parking-pawl solenoids, AS5600 encoders, a BNO085 IMU, INA219 current sensing, and a single-point star ground. Compute is powered directly; motor, servo, and pawl power passes through the E-stop contactor.</desc>
<defs>
<marker id="ah" viewBox="0 0 8 8" markerWidth="6" markerHeight="6" refX="6.5" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.lab{font-size:14px;font-weight:500;fill:#1f2328}
.sub{font-size:12px;font-weight:400;fill:#656d76}
.zh{font-size:12px;font-weight:500;fill:#656d76}
.ln{font-size:12px;font-weight:400;fill:#656d76}
.bg{fill:#ffffff}
@media (prefers-color-scheme:dark){.lab{fill:#e6edf3}.sub,.zh,.ln{fill:#9aa0a8}.bg{fill:#0d1117}}
</style>
</defs>
<rect class="bg" x="0" y="0" width="680" height="600"/>
<line x1="356" y1="144" x2="356" y2="518" stroke="#9aa0a8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="zh" x="350" y="374" text-anchor="middle">galvanic isolation</text>
<rect x="44" y="148" width="270" height="300" rx="6" fill="rgba(46,160,99,0.08)" stroke="rgba(46,160,99,0.5)"/>
<text class="zh" x="52" y="166">clean logic domain</text>
<rect x="428" y="148" width="212" height="192" rx="6" fill="rgba(201,74,58,0.08)" stroke="rgba(201,74,58,0.5)"/>
<text class="zh" x="436" y="170">motor domain · isolated</text>
<rect x="428" y="392" width="212" height="120" rx="6" fill="rgba(196,138,30,0.1)" stroke="rgba(196,138,30,0.55)"/>
<text class="zh" x="436" y="410">servo domain · isolated</text>
<rect x="44" y="44" width="190" height="42" rx="4" fill="rgba(120,125,135,0.16)" stroke="#7a7f88"/>
<text class="lab" x="139" y="62" text-anchor="middle">14.8 V from backbone</text>
<text class="sub" x="139" y="77" text-anchor="middle">M12 · fused per-deck</text>
<rect x="248" y="44" width="170" height="42" rx="4" fill="rgba(120,125,135,0.16)" stroke="#7a7f88"/>
<text class="lab" x="333" y="62" text-anchor="middle">E-stop contactor</text>
<text class="sub" x="333" y="77" text-anchor="middle">cuts motor/servo/pawl</text>
<rect x="470" y="44" width="170" height="42" rx="4" fill="rgba(120,125,135,0.16)" stroke="#7a7f88"/>
<text class="lab" x="555" y="62" text-anchor="middle">Core Hub</text>
<text class="sub" x="555" y="77" text-anchor="middle">USB CDC link</text>
<rect x="104" y="174" width="170" height="40" rx="4" fill="rgba(46,160,99,0.16)" stroke="#2e9d63"/>
<text class="lab" x="189" y="191" text-anchor="middle">5 V / 3 A buck</text>
<text class="sub" x="189" y="205" text-anchor="middle">clean logic rail</text>
