<text class="lab" x="496" y="251" text-anchor="middle">3× MDD10A</text>
<text class="sub" x="496" y="266" text-anchor="middle">dual 10 A</text>
<rect x="566" y="232" width="72" height="44" rx="4" fill="rgba(201,74,58,0.16)" stroke="#c0493a"/>
<text class="lab" x="602" y="251" text-anchor="middle">INA219</text>
<text class="sub" x="602" y="266" text-anchor="middle">bus sense</text>
<rect x="436" y="288" width="120" height="42" rx="4" fill="rgba(201,74,58,0.16)" stroke="#c0493a"/>
