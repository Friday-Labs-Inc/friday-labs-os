<svg xmlns="http://www.w3.org/2000/svg" width="430mm" height="272mm" viewBox="0 0 1660 1050">
<defs>
<marker id="a2" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 z" fill="#2a4066"/></marker>
<marker id="a2t" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 z" fill="#179b86"/></marker>
<marker id="a2r" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 z" fill="#c0493a"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
</defs>
<rect width="1660" height="1050" fill="#ffffff"/>
<rect x="20" y="20" width="1620" height="1010" rx="6" fill="none" stroke="#1f3050" stroke-width="2.5"/>
<rect x="20" y="20" width="1620" height="60" rx="6" fill="#1f3050"/>
<rect x="20" y="74" width="1620" height="6" fill="#20b2a6"/>
<text x="44" y="58" font-size="22" font-weight="bold" fill="#ffffff">Mark 1 — Command &amp; Monitoring Topology  (edge-first, cloud-optional)</text>
<text x="1616" y="52" font-size="12.5" fill="#aebbcf" text-anchor="end">Field control survives an internet cut · the broker lives at the SITE, not the cloud</text>
<text x="1616" y="69" font-size="12.5" fill="#9fb0c8" text-anchor="end">Friday Labs HQ monitors device health to catch a failure before the customer does</text>

<!-- column headers -->
<text x="190" y="108" font-size="13.5" font-weight="bold" fill="#c0493a" text-anchor="middle">ROVER (field)</text>
<text x="498" y="108" font-size="13.5" font-weight="bold" fill="#b9831e" text-anchor="middle">FIELD LINK · 20–30 km RF</text>
<text x="850" y="108" font-size="13.5" font-weight="bold" fill="#179b86" text-anchor="middle">LOCAL COMMAND CENTER (EDGE · at the site)</text>
<text x="1126" y="108" font-size="13" font-weight="bold" fill="#6b7484" text-anchor="middle">BACKHAUL</text>
<text x="1420" y="108" font-size="13.5" font-weight="bold" fill="#2a4066" text-anchor="middle">CLOUD (optional)</text>

<!-- ================= ROVER ================= -->
<rect x="44" y="128" width="300" height="208" rx="11" fill="#fbeeec" stroke="#c0493a" stroke-width="2"/>
<text x="194" y="152" font-size="14.5" font-weight="bold" fill="#c0493a" text-anchor="middle">Mark 1 rover</text>
<text x="194" y="174" font-size="11.5" fill="#5b6472" text-anchor="middle">Telemetry Node Agent + Friday Labs OS</text>
<rect x="60" y="186" width="268" height="58" rx="7" fill="#ffffff" stroke="#c0493a" stroke-width="1.4"/>
<text x="194" y="208" font-size="11.5" font-weight="bold" fill="#2a4066" text-anchor="middle">logs 3 streams:</text>
<text x="194" y="226" font-size="10.5" fill="#5b6472" text-anchor="middle">operational telemetry · DEVICE HEALTH · faults</text>
<rect x="60" y="252" width="268" height="64" rx="7" fill="#ffffff" stroke="#c0493a" stroke-width="1.4"/>
<text x="194" y="274" font-size="11.5" font-weight="bold" fill="#2a4066" text-anchor="middle">multi-path radio</text>
<text x="194" y="292" font-size="10.5" fill="#5b6472" text-anchor="middle">5 GHz · MANET · 4G/5G · LoRa</text>
<text x="194" y="308" font-size="10.5" fill="#5b6472" text-anchor="middle">offline-first: autonomy needs no constant link</text>
<rect x="44" y="352" width="300" height="74" rx="11" fill="#fbeeec" stroke="#c0493a" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="194" y="378" font-size="12.5" font-weight="bold" fill="#c0493a" text-anchor="middle">Spark drone</text>
<text x="194" y="400" font-size="10.5" fill="#5b6472" text-anchor="middle">optional aerial RELAY — extend range / get LoS</text>
<text x="194" y="416" font-size="10.5" fill="#5b6472" text-anchor="middle">over canopy &amp; terrain</text>

<!-- ================= FIELD LINK ================= -->
<rect x="360" y="128" width="276" height="450" rx="12" fill="#fdf4e3" stroke="#b9831e" stroke-width="1.6" stroke-dasharray="9 7"/>
<text x="498" y="150" font-size="11" font-weight="bold" fill="#b9831e" text-anchor="middle">NO internet required</text>
<rect x="376" y="166" width="244" height="150" rx="9" fill="#ffffff" stroke="#179b86" stroke-width="2"/>
<text x="498" y="188" font-size="12.5" font-weight="bold" fill="#178a80" text-anchor="middle">PRIMARY — normal ops</text>
<text x="498" y="206" font-size="10.5" fill="#5b6472" text-anchor="middle">telemetry · video · commands (Mbps)</text>
<text x="392" y="230" font-size="11" fill="#27313f">• 5 GHz directional PtP/PtMP (LoS+mast)</text>
<text x="392" y="250" font-size="11" fill="#27313f">• MANET mesh radio (defense, mobile, NLoS)</text>
<text x="392" y="270" font-size="11" fill="#27313f">• private 4G/5G (where deployable)</text>
<text x="392" y="296" font-size="10" fill="#9a6a20">forest? favor 900 MHz/mesh + Spark relay</text>
<rect x="376" y="330" width="244" height="100" rx="9" fill="#ffffff" stroke="#c0493a" stroke-width="2"/>
<text x="498" y="352" font-size="12.5" font-weight="bold" fill="#c0493a" text-anchor="middle">EMERGENCY — always-on</text>
<text x="498" y="372" font-size="11.5" font-weight="bold" fill="#27313f" text-anchor="middle">LoRa  (bytes only)</text>
<text x="498" y="392" font-size="10.5" fill="#5b6472" text-anchor="middle">e-stop · beacon · status ping</text>
<text x="498" y="410" font-size="10.5" fill="#5b6472" text-anchor="middle">10–15 km, survives when the main link drops</text>
<text x="498" y="456" font-size="10.5" fill="#b9831e" text-anchor="middle" font-weight="bold">rover multi-path picks the</text>
<text x="498" y="472" font-size="10.5" fill="#b9831e" text-anchor="middle" font-weight="bold">best available bearer</text>

<!-- ================= LOCAL COMMAND CENTER ================= -->
<rect x="652" y="128" width="392" height="500" rx="12" fill="#e8f6f2" stroke="#179b86" stroke-width="2.4"/>
<text x="848" y="152" font-size="14" font-weight="bold" fill="#178a80" text-anchor="middle">runs at the site: ruggedized box / field server / laptop</text>
<g>
<rect x="668" y="166" width="118" height="70" rx="7" fill="#ffffff" stroke="#2a4066" stroke-width="1.5"/><text x="727" y="196" font-size="11.5" font-weight="bold" fill="#2a4066" text-anchor="middle">MQTT broker</text><text x="727" y="214" font-size="9.5" fill="#5b6472" text-anchor="middle">LOCAL</text>
<rect x="792" y="166" width="118" height="70" rx="7" fill="#ffffff" stroke="#b9831e" stroke-width="1.5"/><text x="851" y="196" font-size="11.5" font-weight="bold" fill="#b9831e" text-anchor="middle">Bridge</text><text x="851" y="214" font-size="9.5" fill="#5b6472" text-anchor="middle">async</text>
<rect x="916" y="166" width="118" height="70" rx="7" fill="#ffffff" stroke="#b9831e" stroke-width="1.5"/><text x="975" y="192" font-size="11" font-weight="bold" fill="#b9831e" text-anchor="middle">Time-series</text><text x="975" y="208" font-size="11" font-weight="bold" fill="#b9831e" text-anchor="middle">store</text><text x="975" y="224" font-size="9" fill="#5b6472" text-anchor="middle">telemetry buffer</text>
<rect x="668" y="246" width="118" height="70" rx="7" fill="#ffffff" stroke="#2a4066" stroke-width="1.5"/><text x="727" y="272" font-size="11" font-weight="bold" fill="#2a4066" text-anchor="middle">Operator UI</text><text x="727" y="290" font-size="9" fill="#5b6472" text-anchor="middle">+ Foxglove</text>
<rect x="792" y="246" width="118" height="70" rx="7" fill="#ffffff" stroke="#179b86" stroke-width="1.5"/><text x="851" y="272" font-size="11" font-weight="bold" fill="#179b86" text-anchor="middle">Signing</text><text x="851" y="290" font-size="9" fill="#5b6472" text-anchor="middle">local HSM</text>
<rect x="916" y="246" width="118" height="70" rx="7" fill="#ffffff" stroke="#179b86" stroke-width="1.5"/><text x="975" y="272" font-size="11" font-weight="bold" fill="#179b86" text-anchor="middle">Local audit</text><text x="975" y="290" font-size="9" fill="#5b6472" text-anchor="middle">+ records</text>
</g>
<rect x="668" y="332" width="366" height="86" rx="9" fill="#ffffff" stroke="#179b86" stroke-width="2"/>
<text x="851" y="358" font-size="13.5" font-weight="bold" fill="#178a80" text-anchor="middle">FULLY AUTONOMOUS OFFLINE</text>
<text x="851" y="380" font-size="11.5" fill="#27313f" text-anchor="middle">the operator's command + live monitoring lives HERE,</text>
<text x="851" y="398" font-size="11.5" fill="#27313f" text-anchor="middle">not in the cloud — works with zero internet.</text>
<rect x="668" y="432" width="366" height="62" rx="9" fill="#eef3f9" stroke="#2a4066" stroke-width="1.3"/>
<text x="851" y="456" font-size="11.5" font-weight="bold" fill="#2a4066" text-anchor="middle">store-and-forward</text>
<text x="851" y="476" font-size="10.5" fill="#5b6472" text-anchor="middle">buffers telemetry/health/audit → syncs to cloud when backhaul returns</text>

<!-- ================= BACKHAUL ================= -->
<rect x="1060" y="166" width="120" height="328" rx="11" fill="#eef1f5" stroke="#6b7484" stroke-width="1.6" stroke-dasharray="9 7"/>
<text x="1120" y="220" font-size="11.5" font-weight="bold" fill="#6b7484" text-anchor="middle">intermittent</text>
<text x="1120" y="250" font-size="11" fill="#5b6472" text-anchor="middle">Starlink</text>
<text x="1120" y="272" font-size="11" fill="#5b6472" text-anchor="middle">cellular</text>
<text x="1120" y="294" font-size="11" fill="#5b6472" text-anchor="middle">satellite</text>
<text x="1120" y="340" font-size="10.5" fill="#c0493a" text-anchor="middle" font-weight="bold">may be DOWN</text>
<text x="1120" y="360" font-size="10.5" fill="#5b6472" text-anchor="middle">for hours/days</text>
<text x="1120" y="400" font-size="10" fill="#5b6472" text-anchor="middle">loss ≠ control loss</text>

<!-- ================= CLOUD ================= -->
<rect x="1200" y="128" width="424" height="226" rx="12" fill="#eef3f9" stroke="#2a4066" stroke-width="2"/>
<text x="1412" y="152" font-size="14" font-weight="bold" fill="#1f3050" text-anchor="middle">FRIDAY LABS HQ — Fleet Health &amp; Device Mgmt</text>
<text x="1216" y="178" font-size="11.5" fill="#27313f">• device heartbeat/health/faults from ALL rovers</text>
<text x="1216" y="200" font-size="11.5" fill="#27313f">• fault-detection + anomaly + predictive maintenance</text>
<text x="1216" y="222" font-size="11.5" font-weight="bold" fill="#c0493a">→ catch a Mark 1 failure BEFORE the customer notices</text>
<text x="1216" y="244" font-size="11.5" fill="#27313f">• firmware/OTA fleet, warranty, RMA, support</text>
<rect x="1216" y="258" width="392" height="80" rx="8" fill="#ffffff" stroke="#b9831e" stroke-width="1.4"/>
<text x="1412" y="280" font-size="11.5" font-weight="bold" fill="#b9831e" text-anchor="middle">privacy / defense:</text>
<text x="1412" y="300" font-size="10.5" fill="#5b6472" text-anchor="middle">phone-home is OPT-IN. Sensitive sites run fully air-gapped;</text>
<text x="1412" y="318" font-size="10.5" fill="#5b6472" text-anchor="middle">device-health exported by hand. Mission data stays with the customer.</text>
<rect x="1200" y="372" width="424" height="190" rx="12" fill="#f4f7fb" stroke="#2a4066" stroke-width="1.6"/>
<text x="1412" y="396" font-size="14" font-weight="bold" fill="#1f3050" text-anchor="middle">CUSTOMER HQ — Fleet Operations</text>
<text x="1216" y="420" font-size="11.5" fill="#27313f">• multi-site fleet view · missions · audit · RBAC</text>
<text x="1216" y="442" font-size="11.5" font-weight="bold" fill="#179b86">• Frappe control plane (system of record)</text>
<text x="1216" y="464" font-size="11.5" fill="#27313f">• syncs from each site's Local Command Center</text>
<text x="1216" y="490" font-size="10.5" fill="#5b6472">For a single mobile operator the Local CC IS the whole</text>
<text x="1216" y="508" font-size="10.5" fill="#5b6472">command center (a laptop); cloud is added when there are</text>
<text x="1216" y="526" font-size="10.5" fill="#5b6472">many sites/rovers to roll up.</text>

<!-- flows -->
<path d="M344 232 L360 232" stroke="#2a4066" stroke-width="2.4" marker-end="url(#a2)"/>
<path d="M360 250 L344 250" stroke="#179b86" stroke-width="2.4" marker-end="url(#a2t)"/>
<path d="M636 250 L652 250" stroke="#2a4066" stroke-width="2.6" marker-end="url(#a2)"/>
<path d="M652 270 L636 270" stroke="#179b86" stroke-width="2.6" marker-end="url(#a2t)"/>
<text x="498" y="540" font-size="10" fill="#5b6472" text-anchor="middle">commands ⇄ telemetry</text>
<path d="M1044 330 L1060 330" stroke="#6b7484" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<path d="M1180 320 L1200 320" stroke="#6b7484" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<text x="1120" y="470" font-size="9.5" fill="#6b7484" text-anchor="middle">sync when up</text>

<!-- resilience callouts -->
<rect x="44" y="650" width="1000" height="118" rx="10" fill="#fbeeec" stroke="#c0493a" stroke-width="1.6"/>
<text x="62" y="676" font-size="13.5" font-weight="bold" fill="#c0493a">What happens when the internet is cut?</text>
<text x="62" y="702" font-size="12" fill="#27313f">① The field operator KEEPS full local command + live monitoring — the broker, UI, signing and telemetry store are all at the site, reached over RF.</text>
<text x="62" y="724" font-size="12" fill="#27313f">② Only the cloud roll-up (Friday Labs HQ health view, customer multi-site view) goes stale — and BACKFILLS automatically from the store-and-forward buffer on reconnect.</text>
<text x="62" y="746" font-size="12" fill="#27313f">③ LoRa emergency-stop/beacon is a separate always-on path, independent of the primary link and the internet. Safety never depends on connectivity.</text>

<rect x="1064" y="650" width="560" height="118" rx="10" fill="#e8f6f2" stroke="#179b86" stroke-width="1.6"/>
<text x="1084" y="676" font-size="13.5" font-weight="bold" fill="#178a80">Two monitoring planes, on purpose</text>
<text x="1084" y="702" font-size="11.5" fill="#27313f"><tspan font-weight="bold">Operational</tspan> (customer): drive, mission, mission data — at the Local CC.</text>
<text x="1084" y="724" font-size="11.5" fill="#27313f"><tspan font-weight="bold">Device health</tspan> (Friday Labs): heartbeat, error codes, thermal,</text>
<text x="1084" y="742" font-size="11.5" fill="#27313f">battery cycles, firmware — forwarded to HQ for early fault detection.</text>
<text x="1084" y="760" font-size="10.5" fill="#5b6472">Same rover logs; different consumers; defense can sever the HQ path.</text>

<!-- legend -->
<text x="44" y="800" font-size="11.5" font-weight="bold" fill="#5b6472">KEY PRINCIPLE</text>
<text x="160" y="800" font-size="12" fill="#27313f">The broker + operator console live at the FIELD (edge). Cloud is for fleet roll-up + manufacturer monitoring — its loss degrades the HQ view, never field control.</text>
<line x1="44" y1="812" x2="1616" y2="812" stroke="#d9e0ea" stroke-width="1"/>
<text x="44" y="836" font-size="11" fill="#5b6472">Deploy sizes:  mobile operator = laptop Local CC  ·  fixed site = ruggedized server + mast  ·  enterprise = many Local CCs → cloud roll-up.    Comms by range/data:  LoRa (15 km / bytes) → 900 MHz·mesh (10–20 km / Mbps, NLoS) → 5 GHz directional (30 km / 100s Mbps, LoS) → satellite (backhaul).</text>
</svg>
